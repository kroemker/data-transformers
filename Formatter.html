<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Formatter (Dark Mode)</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      min-height: 0;
    }

    label {
      margin: 10px 0 5px;
      font-weight: bold;
      color: #cfcfcf;
    }

    textarea {
      width: 100%;
      height: 200px;
      min-height: 60px;
      resize: vertical;
      font-family: monospace;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
      background-color: #2d2d2d;
      color: #d4d4d4;
      border: 1px solid #444;
      text-wrap-mode: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .controls label {
      margin: 0;
    }

    select {
      background-color: #3c3c3c;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #0e639c;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #1177bb;
    }

    .error-box {
      color: #ff5555;
      font-weight: bold;
      border: 1px solid #ff5555;
      padding: 10px;
      background-color: #2e1e1e;
      display: none;
      margin-bottom: 10px;
    }

    .error-symbol {
      margin-right: 10px;
    }

    #outputContainer {
      flex: 1;
      min-height: 200px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <label for="inputText">Input:</label>
    <textarea id="inputText" placeholder="Paste code here..."></textarea>

    <div class="controls">
      <label for="languageSelect">Language:</label>
      <select id="languageSelect">
        <option value="json">JSON</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS / SCSS</option>
        <option value="sql">SQL</option>
        <option value="yaml">YAML</option>
        <option value="xml">XML</option>
        <option value="c">C</option>
      </select>
      <button id="formatButton">Format</button>
    </div>

    <div id="errorBox" class="error-box">
      <span class="error-symbol">❌</span>
      <span id="errorMessage"></span>
    </div>

    <label>Formatted Output:</label>
    <div id="outputContainer"></div>
  </div>

  <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-typescript.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-html.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-postcss.js"></script>
  <script src="https://unpkg.com/prettier@2.8.8/parser-yaml.js"></script>
  <script src="https://unpkg.com/sql-formatter@15.4.2/dist/sql-formatter.min.js"></script>
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    let outputEditor;

    require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      outputEditor = monaco.editor.create(document.getElementById('outputContainer'), {
        value: '',
        language: 'json',
        theme: 'vs-dark',
        readOnly: true,
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
      });
    });

    function formatXml(xml) {
      const lines = [];
      let indent = 0;
      const tokens = xml.replace(/>\s*</g, '>\n<').trim().split('\n');

      for (let token of tokens) {
        token = token.trim();
        if (!token) continue;

        const isClosing = /^<\//.test(token);
        const isSelfClosing = /\/>$/.test(token) || /^<!/.test(token) || /^<\?/.test(token);
        const isOpening = /^<[^/]/.test(token) && !isSelfClosing;

        if (isClosing) indent = Math.max(0, indent - 1);
        lines.push('  '.repeat(indent) + token);
        if (isOpening) indent++;
      }

      return lines.join('\n');
    }

    function formatC(code) {
      const lines = code
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .split('\n');

      let indent = 0;
      const result = [];

      for (let line of lines) {
        line = line.trim();
        if (!line) {
          result.push('');
          continue;
        }

        if (line.startsWith('}')) indent = Math.max(0, indent - 1);
        result.push('    '.repeat(indent) + line);
        if (line.endsWith('{')) indent++;
      }

      return result.join('\n');
    }

    // Map select value → Monaco language id
    const monacoLang = {
      json: 'json',
      javascript: 'javascript',
      typescript: 'typescript',
      html: 'html',
      css: 'css',
      sql: 'sql',
      yaml: 'yaml',
      xml: 'xml',
      c: 'c',
    };

    function format() {
      const input = document.getElementById('inputText').value;
      const lang = document.getElementById('languageSelect').value;
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');

      errorBox.style.display = 'none';

      if (!outputEditor) {
        errorMessage.textContent = 'Editor not ready yet.';
        errorBox.style.display = 'block';
        return;
      }

      try {
        let formatted;

        if (lang === 'json') {
          formatted = JSON.stringify(JSON.parse(input), null, 2);
        } else if (lang === 'javascript') {
          formatted = prettier.format(input, { parser: 'babel', plugins: prettierPlugins });
        } else if (lang === 'typescript') {
          formatted = prettier.format(input, { parser: 'typescript', plugins: prettierPlugins });
        } else if (lang === 'html') {
          formatted = prettier.format(input, { parser: 'html', plugins: prettierPlugins });
        } else if (lang === 'css') {
          formatted = prettier.format(input, { parser: 'css', plugins: prettierPlugins });
        } else if (lang === 'yaml') {
          formatted = prettier.format(input, { parser: 'yaml', plugins: prettierPlugins });
        } else if (lang === 'sql') {
          formatted = sqlFormatter.format(input, { language: 'sql' });
        } else if (lang === 'xml') {
          formatted = formatXml(input);
        } else if (lang === 'c') {
          formatted = formatC(input);
        }

        monaco.editor.setModelLanguage(outputEditor.getModel(), monacoLang[lang]);
        outputEditor.setValue(formatted);
      } catch (e) {
        errorMessage.textContent = e.message || String(e);
        errorBox.style.display = 'block';
      }
    }

    document.getElementById('formatButton').addEventListener('click', format);

    document.getElementById('inputText').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) format();
    });
  </script>
</body>
</html>
