<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TS Executor with Monaco (Dark Mode)</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #d4d4d4;
      --label-fg: #cfcfcf;
      --panel-bg: #2d2d2d;
      --border: #444;
      --btn-bg: #0e639c;
      --btn-bg-hover: #1177bb;
      --btn-fg: #ffffff;
      --error-fg: #ff5555;
      --error-bg: #2e1e1e;
      --error-border: #ff5555;
    }

    html[data-theme="light"] {
      --bg: #ffffff;
      --fg: #1e1e1e;
      --label-fg: #333333;
      --panel-bg: #f5f5f5;
      --border: #ccc;
      --btn-bg: #0e639c;
      --btn-bg-hover: #1177bb;
      --btn-fg: #ffffff;
      --error-fg: #cc0000;
      --error-bg: #fff0f0;
      --error-border: #cc0000;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }

    label {
      margin: 10px 0 5px;
      font-weight: bold;
      color: var(--label-fg);
    }

    textarea {
      width: 100%;
      height: 30%;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
      background-color: var(--panel-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      text-wrap-mode: nowrap;
    }

    #editorContainer {
      flex: 1;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-bottom: 10px;
      align-self: flex-start;
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--btn-bg-hover);
    }

    .error-box {
      color: var(--error-fg);
      font-weight: bold;
      border: 1px solid var(--error-border);
      padding: 10px;
      background-color: var(--error-bg);
      display: none;
      margin-bottom: 10px;
    }

    .error-symbol {
      margin-right: 10px;
    }

    .theme-toggle {
      margin: 0;
    }

    .input-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-header label {
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="input-header">
      <label for="inputText">Input Text:</label>
      <button id="themeToggle" class="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    </div>
    <textarea id="inputText" placeholder="Enter input text here..."></textarea>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
      <label for="editorContainer">TypeScript Code:</label>
      <select id="snippetSelector">
        <option value="">-- Select Snippet --</option>
      </select>
    </div>
    <div id="editorContainer"></div>

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 10px;">
      <button id="runButton" style="margin-bottom: 0;">Run Code</button>
      <label style="margin: 0; display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
        <input type="checkbox" id="autoRun"> Auto-run
      </label>
    </div>

    <div id="errorBox" class="error-box">
      <span class="error-symbol">❌</span>
      <span id="errorMessage"></span>
    </div>

    <label for="outputText">Output Text:</label>
    <textarea id="outputText" readonly placeholder="Output will appear here..."></textarea>
  </div>

  <!-- ✅ Load TypeScript UMD build (exposes global `ts`) -->
  <script src="https://unpkg.com/typescript@5.4.5/lib/typescript.js"></script>

  <!-- ✅ Load Monaco Editor -->
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
      themeToggle.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
      if (typeof monaco !== 'undefined') {
        monaco.editor.setTheme(theme === 'light' ? 'vs' : 'vs-dark');
      }
    }
    let currentTheme = localStorage.getItem('ui.theme') || 'dark';
    applyTheme(currentTheme);
    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      localStorage.setItem('ui.theme', currentTheme);
      applyTheme(currentTheme);
    });

    let editor;
    let autoRunTimer = null;
    const autoRunCheckbox = document.getElementById('autoRun');
    autoRunCheckbox.checked = localStorage.getItem('tt.autorun') === 'true';
    autoRunCheckbox.addEventListener('change', () => {
      localStorage.setItem('tt.autorun', autoRunCheckbox.checked);
      if (autoRunCheckbox.checked) runCode();
    });

    function scheduleAutoRun() {
      if (!autoRunCheckbox.checked) return;
      clearTimeout(autoRunTimer);
      autoRunTimer = setTimeout(runCode, 400);
    }

    document.getElementById('inputText').value = localStorage.getItem('tt.input') || '';
    document.getElementById('inputText').addEventListener('input', e => {
      localStorage.setItem('tt.input', e.target.value);
      scheduleAutoRun();
    });

    require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editorContainer'), {
        value: localStorage.getItem('tt.code') || `function process(input: string): string {
  return input.toUpperCase();
}`,
        language: 'typescript',
        theme: currentTheme === 'light' ? 'vs' : 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: false }
      });
      editor.onDidChangeModelContent(() => {
        localStorage.setItem('tt.code', editor.getValue());
        scheduleAutoRun();
      });
    });

    const snippets = [
      {
        "name": "Filter SQL Logs",
        "snippet": `
function process(input: string): string {
  return input.split("\\n")
    .map(line => line.match(/.*(\\d+ms).* from (\\w+) .*/))
    .map(x => x?.[1] + ", " + x?.[2])
    .join("\\n");
}`
      }
    ];

    const snippetSelector = document.getElementById('snippetSelector');

    snippets.forEach((item, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = item.name;
      snippetSelector.appendChild(option);
    });

    snippetSelector.addEventListener('change', () => {
      const selectedIndex = snippetSelector.value;
      if (selectedIndex !== '') {
        const selectedSnippet = snippets[selectedIndex];
        editor.setValue(selectedSnippet.snippet.trim());
      }
    });

    document.getElementById('runButton').addEventListener('click', () => {
      if (typeof ts === 'undefined') {
        alert('TypeScript compiler not yet loaded.');
        return;
      }
      runCode();
    });

    function runCode() {
      if (!editor || typeof ts === 'undefined') return;

      const input = document.getElementById('inputText').value;
      const tsCode = editor.getValue();
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');
      const output = document.getElementById('outputText');

      errorBox.style.display = 'none';
      errorMessage.textContent = '';
      output.value = '';

      try {
        const jsCode = ts.transpile(tsCode);
        const func = new Function(jsCode + '\nreturn process;')();
        const result = func(input);
        output.value = String(result);
      } catch (e) {
        errorBox.style.display = 'block';
        errorMessage.textContent = e.message;
      }
    }
  </script>
</body>
</html>
